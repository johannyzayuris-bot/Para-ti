<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }
        .reproductor-container {
            display: none; /* Se muestra al presionar */
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 40px;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .reproductor-title {
            font-size: 16px;
            color: #d11a2a;
            font-weight: bold;
            margin-bottom: 5px;
        }
        audio {
            outline: none;
            height: 40px;
        }
        .heart-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 200px;
        }
        .heart-btn {
            font-size: 90px;
            cursor: pointer;
            transition: transform 0.2s;
            background: none;
            border: none;
            outline: none;
            z-index: 5;
            color: #d11a2a;
        }
        .heart-btn:active {
            transform: scale(0.9);
        }
        .heart-btn.active {
            animation: beat 0.6s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
        /* EFECTO DE LAS FRASES SALIENDO DEL CORAZÓN */
        .frase-flotante {
            position: absolute;
            font-size: 22px;
            color: #d11a2a;
            font-weight: bold;
            text-align: center;
            width: 280px;
            pointer-events: none;
            opacity: 0;
            animation: flotarYSalir 4s forwards ease-out;
            z-index: 2;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        @keyframes flotarYSalir {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateY(-40px) scale(1);
            }
            80% {
                opacity: 1;
                transform: translateY(-100px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-140px) scale(0.8);
            }
        }
        .indicador {
            position: absolute;
            bottom: 40px;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Reproductor que sale arriba -->
    <div class="reproductor-container" id="contenedor-audio">
        <div class="reproductor-title">Te dedico esta canción ❤</div>
        <audio id="musica-fondo" controls loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- El Corazón Mágico -->
    <div class="heart-container" id="espacio-corazon">
        <button class="heart-btn" id="boton-corazon" onclick="alAplastarCorazon()">❤</button>
    </div>

    <div class="indicador" id="texto-guia">Press heart ❤</div>

    <script>
        // ESCRIBE AQUÍ TUS FRASES (Puedes cambiarlas libremente)
        const frases = [
            "Eres mi lugar favorito. Gracias por llegar a mi vida. 💖",
            "Contigo todo es mejor. Siempre te elegiría a ti.",
            "Eres mi felicidad. Mi corazón es más feliz contigo. 😊",
            "Amo cada momento a tu lado. Eres mi paz.",
            "Eres mi persona favorita. Gracias por hacerme sonreír. 💕",
            "Tu abrazo es mi hogar. Eres mi mejor casualidad.",
            "Eres el amor que siempre soñé. Mi corazón te pertenece.",
            "Te amo más de lo que las palabras pueden decir. , Olafcitooo 
        ];

        let indice = 0;
        let musica = document.getElementById("musica-fondo");
        let boton = document.getElementById("boton-corazon");
        let textoGuia = document.getElementById("texto-guia");
        let contenedorAudio = document.getElementById("contenedor-audio");
        let espacioCorazon = document.getElementById("espacio-corazon");
        let iniciado = false;

        function alAplastarCorazon() {
            if (!iniciado) {
                iniciado = true;
                textoGuia.style.display = 'none';
                boton.classList.add('active');
                contenedorAudio.style.display = 'flex'; // Muestra el reproductor arriba
                
                musica.play().catch(error => {
                    console.log("Audio block bypass");
                });
            }

            // Quita la frase anterior para poner la nueva
            const fraseVieja = document.querySelector('.frase-flotante');
            if (fraseVieja) {
                fraseVieja.remove();
            }

            // Hace nacer la frase desde adentro del corazón
            let nuevaFrase = document.createElement("div");
            nuevaFrase.className = "frase-flotante";
            nuevaFrase.textContent = frases[indice];
            
            espacioCorazon.appendChild(nuevaFrase);

            // Cambia a la siguiente frase en la lista
            indice = (indice + 1) % frases.length;
        }
    </script>
</body>
</html>
